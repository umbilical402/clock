<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>World Clock</title>
<style>
  :root {
    color-scheme: dark;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    align-items: stretch;
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    transition: filter 3s ease;
  }

  body.night-dim {
    filter: brightness(0.55);
  }

  .row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 0 6vw;
    border-bottom: 1px solid #1a1a1a;
    transition: opacity 3s ease;
  }

  .row:last-child {
    border-bottom: none;
  }

  .row.is-night {
    opacity: 0.78;
  }

  .city {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .city-name-line {
    display: flex;
    align-items: center;
    gap: 0.5em;
  }

  .city-name {
    font-size: 1.6rem;
    font-size: clamp(1.1rem, 2.6vw, 2.1rem);
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #888;
  }

  .dot {
    width: 0.5em;
    height: 0.5em;
    border-radius: 50%;
    background: #444;
    flex: none;
  }

  .dot.day {
    background: #e8b93f;
    box-shadow: 0 0 0.5em rgba(232, 185, 63, 0.55);
  }

  .dot.night {
    background: #5b6ea8;
    box-shadow: 0 0 0.5em rgba(91, 110, 168, 0.55);
  }

  .sub-line {
    font-size: 0.9rem;
    font-size: clamp(0.75rem, 1.3vw, 1.05rem);
    color: #555;
    margin-top: 0.35em;
    letter-spacing: 0.03em;
  }

  .tz-label {
    color: #666;
  }

  .time {
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
    font-size: 5rem;
    font-size: clamp(3rem, 12vw, 9rem);
    font-weight: 200;
    color: #f2f2f2;
    line-height: 1;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }

  .time .secs {
    font-size: 0.5em;
    color: #666;
  }

  .time .colon {
    display: inline-block;
    animation: pulse 1s ease-in-out infinite;
  }

  @keyframes pulse {
    0%   { opacity: 1; }
    50%  { opacity: 0.25; }
    100% { opacity: 1; }
  }

  .home .time {
    color: #ffffff;
  }

  .home .city-name {
    color: #aaa;
  }

  #fallback-msg {
    display: none;
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding: 1em 1.5em;
    background: #200;
    color: #f88;
    font-size: 0.9rem;
    line-height: 1.4;
    border-top: 1px solid #500;
  }
</style>
</head>
<body>

  <div class="row home" data-tz="Australia/Sydney">
    <div class="city">
      <div class="city-name-line">
        <div class="city-name">Sydney</div>
        <div class="dot"></div>
      </div>
      <div class="sub-line"><span class="tz-label"></span> &middot; <span class="city-date"></span></div>
    </div>
    <div class="time"><span class="hour">--</span><span class="colon">:</span><span class="minute">--</span><span class="colon">:</span><span class="secs">--</span></div>
  </div>

  <div class="row" data-tz="Australia/Brisbane">
    <div class="city">
      <div class="city-name-line">
        <div class="city-name">Brisbane</div>
        <div class="dot"></div>
      </div>
      <div class="sub-line"><span class="tz-label"></span> &middot; <span class="city-date"></span></div>
    </div>
    <div class="time"><span class="hour">--</span><span class="colon">:</span><span class="minute">--</span><span class="colon">:</span><span class="secs">--</span></div>
  </div>

  <div class="row" data-tz="America/Toronto">
    <div class="city">
      <div class="city-name-line">
        <div class="city-name">Toronto</div>
        <div class="dot"></div>
      </div>
      <div class="sub-line"><span class="tz-label"></span> &middot; <span class="city-date"></span></div>
    </div>
    <div class="time"><span class="hour">--</span><span class="colon">:</span><span class="minute">--</span><span class="colon">:</span><span class="secs">--</span></div>
  </div>

  <div id="fallback-msg"></div>

<script>
  // Written in old-fashioned ES5 (var, plain functions, no formatToParts /
  // no exotic Intl timeZoneName styles like "shortOffset") on purpose: this
  // clock is meant to run for years on an old iPad whose Safari/iOS can't be
  // updated any more, so it deliberately avoids anything added to the
  // language or the Intl API after roughly 2016.

  var HAS_INTL = (typeof Intl !== 'undefined' && typeof Intl.DateTimeFormat === 'function');

  function pad2(s) {
    s = String(s);
    return s.length < 2 ? '0' + s : s;
  }

  // ---- Manual, Intl-free fallback for the exact three zones this clock uses ----
  // Some Safari/iPadOS builds too old to update don't have the Intl object at
  // all (not just missing pieces of it) -- this hand-codes the current DST
  // rules for these regions using nothing but the plain Date object, which
  // has existed since the earliest JavaScript engines. It's correct for the
  // foreseeable future, but unlike Intl won't auto-update if a government
  // changes its DST rules down the track.
  var DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  function nthSundayUTC(year, monthIndex0, n) {
    var firstDay = new Date(Date.UTC(year, monthIndex0, 1)).getUTCDay();
    var firstSunday = 1 + ((7 - firstDay) % 7);
    return firstSunday + (n - 1) * 7;
  }

  function manualZoneInfo(tz, nowMs) {
    var y = new Date(nowMs).getUTCFullYear();
    if (tz === 'Australia/Brisbane') return { offset: 600, abbr: 'AEST' };
    if (tz === 'Australia/Sydney') {
      // AU eastern DST: starts first Sunday of October 2am AEST, ends first
      // Sunday of April 3am AEDT. Spans the New Year, so both boundaries are
      // computed off the same calendar year as "now".
      var dstStart = Date.UTC(y, 9, nthSundayUTC(y, 9, 1), 2, 0, 0) - 600 * 60000;
      var dstEnd = Date.UTC(y, 3, nthSundayUTC(y, 3, 1), 3, 0, 0) - 660 * 60000;
      var isDst = (nowMs >= dstStart) || (nowMs < dstEnd);
      return isDst ? { offset: 660, abbr: 'AEDT' } : { offset: 600, abbr: 'AEST' };
    }
    if (tz === 'America/Toronto') {
      // US/Canada DST: starts 2nd Sunday of March 2am EST, ends 1st Sunday
      // of November 2am EDT. Doesn't span the New Year.
      var dstStart2 = Date.UTC(y, 2, nthSundayUTC(y, 2, 2), 2, 0, 0) + 300 * 60000;
      var dstEnd2 = Date.UTC(y, 10, nthSundayUTC(y, 10, 1), 2, 0, 0) + 240 * 60000;
      var isDst2 = (nowMs >= dstStart2) && (nowMs < dstEnd2);
      return isDst2 ? { offset: -240, abbr: 'EDT' } : { offset: -300, abbr: 'EST' };
    }
    return { offset: 0, abbr: '' };
  }

  function offsetLabel(offsetMin) {
    var sign = offsetMin >= 0 ? '+' : '-';
    var abs = Math.abs(offsetMin);
    var h = Math.floor(abs / 60);
    var mm = abs % 60;
    return 'UTC' + sign + h + (mm ? ':' + pad2(mm) : '');
  }

  function manualParts(tz, nowMs) {
    var info = manualZoneInfo(tz, nowMs);
    var local = new Date(nowMs + info.offset * 60000);
    return {
      hour: pad2(local.getUTCHours()),
      minute: pad2(local.getUTCMinutes()),
      second: pad2(local.getUTCSeconds()),
      dateLabel: DAY_NAMES[local.getUTCDay()] + ' ' + local.getUTCDate() + ' ' + MONTH_NAMES[local.getUTCMonth()],
      tzLabel: info.abbr + ' · ' + offsetLabel(info.offset)
    };
  }

  // Pulls "HH:MM:SS" out of a formatted time string regardless of the exact
  // separators/spacing a given locale uses.
  function extractHms(str) {
    var m = str.match(/(\d{1,2})\D+(\d{1,2})\D+(\d{1,2})/);
    if (!m) return null;
    return { hour: pad2(m[1]), minute: pad2(m[2]), second: pad2(m[3]) };
  }

  function getTimeParts(tz, date) {
    var dtf = new Intl.DateTimeFormat('en-GB', {
      timeZone: tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    });
    return extractHms(dtf.format(date));
  }

  // Works out the UTC offset (e.g. "UTC+10") by formatting the same instant
  // in the target zone with plain numeric/2-digit fields (safe on very old
  // engines) and comparing it against the real UTC timestamp -- instead of
  // asking Intl for a "shortOffset" style string, which older Safari/iPadOS
  // versions don't recognise and will throw on.
  function getUtcOffsetLabel(tz, date) {
    try {
      // Include seconds here even though we don't display them -- without
      // them the local reading is truncated to the start of its minute,
      // which biases the diff below by up to 59 seconds and can round to
      // the wrong minute (e.g. "+9:59" instead of "+10:00").
      var dtf = new Intl.DateTimeFormat('en-US', {
        timeZone: tz, hour12: false,
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
      var s = dtf.format(date);
      var m = s.match(/(\d{1,2})\D(\d{1,2})\D(\d{4}).*?(\d{1,2})\D(\d{1,2})\D(\d{1,2})/);
      if (!m) return '';
      var asUTC = Date.UTC(Number(m[3]), Number(m[1]) - 1, Number(m[2]), Number(m[4]), Number(m[5]), Number(m[6]));
      var diffMin = Math.round((asUTC - date.getTime()) / 60000);
      var sign = diffMin >= 0 ? '+' : '-';
      var abs = Math.abs(diffMin);
      var h = Math.floor(abs / 60);
      var mm = abs % 60;
      return 'UTC' + sign + h + (mm ? ':' + pad2(mm) : '');
    } catch (e) {
      return '';
    }
  }

  // Tries to get a real abbreviation (AEST, EDT, ...). Some locales' CLDR
  // data don't have one for a given zone and quietly fall back to a bare
  // "GMT+n" string instead, so a couple of locales are tried in turn.
  function getTzAbbr(tz, date) {
    var locales = ['en-AU', 'en-US'];
    var fallback = '';
    for (var i = 0; i < locales.length; i++) {
      try {
        var str = new Intl.DateTimeFormat(locales[i], {
          timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false, timeZoneName: 'short'
        }).format(date);
        var tokens = str.replace(/,/g, ' ').trim().split(/\s+/);
        var abbr = tokens[tokens.length - 1];
        if (abbr && !/^(GMT|UTC)/i.test(abbr)) return abbr;
        if (abbr && !fallback) fallback = abbr;
      } catch (e) { /* try next locale */ }
    }
    return fallback;
  }

  function getTzLabel(tz, date) {
    var abbr = getTzAbbr(tz, date);
    var offset = getUtcOffsetLabel(tz, date);
    if (!abbr || /^(GMT|UTC)/i.test(abbr)) return offset || abbr;
    return offset ? (abbr + ' · ' + offset) : abbr;
  }

  function getDateLabel(tz, date) {
    var dtf = new Intl.DateTimeFormat('en-AU', {
      timeZone: tz, weekday: 'long', day: 'numeric', month: 'long'
    });
    return dtf.format(date);
  }

  function getLocalHour(tz, date) {
    var parts = getTimeParts(tz, date);
    return parts ? Number(parts.hour) : null;
  }

  // Single entry point tick() calls per row: prefers Intl (it stays correct
  // automatically if a government ever changes DST rules), and falls back to
  // the manual, Intl-free calculation above -- either because Intl isn't
  // there at all, or because some call into it failed unexpectedly.
  function getAllParts(tz, date) {
    if (HAS_INTL) {
      try {
        var t = getTimeParts(tz, date);
        if (t) {
          return {
            hour: t.hour,
            minute: t.minute,
            second: t.second,
            dateLabel: getDateLabel(tz, date),
            tzLabel: getTzLabel(tz, date)
          };
        }
      } catch (e) { /* fall through to the manual calculation below */ }
    }
    return manualParts(tz, date.getTime());
  }

  function toArray(nodeList) {
    return Array.prototype.slice.call(nodeList);
  }

  function buildRows() {
    var rowEls = toArray(document.querySelectorAll('.row'));
    var out = [];
    for (var i = 0; i < rowEls.length; i++) {
      var row = rowEls[i];
      out.push({
        tz: row.getAttribute('data-tz'),
        row: row,
        hourEl: row.querySelector('.hour'),
        minuteEl: row.querySelector('.minute'),
        secsEl: row.querySelector('.secs'),
        dateEl: row.querySelector('.city-date'),
        labelEl: row.querySelector('.tz-label'),
        dotEl: row.querySelector('.dot'),
        lastLabelMinute: -1
      });
    }
    return out;
  }

  function showFallback(message) {
    var el = document.getElementById('fallback-msg');
    if (!el) return;
    el.textContent = message;
    el.style.display = 'block';
  }

  function setClass(el, cls, on) {
    if (!el) return;
    if (on) { el.classList.add(cls); } else { el.classList.remove(cls); }
  }

  var rows = [];
  var tickFailCount = 0;

  function tick() {
    try {
      var now = new Date();

      var sydneyHour = null;

      for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        try {
          var p = getAllParts(r.tz, now);

          r.hourEl.textContent = p.hour;
          r.minuteEl.textContent = p.minute;
          r.secsEl.textContent = p.second;
          if (r.dateEl) r.dateEl.textContent = p.dateLabel;

          var hour24 = Number(p.hour);
          var isDay = hour24 >= 6 && hour24 < 18;
          setClass(r.dotEl, 'day', isDay);
          setClass(r.dotEl, 'night', !isDay);
          setClass(r.row, 'is-night', !isDay);

          if (r.labelEl) r.labelEl.textContent = p.tzLabel;

          if (r.tz === 'Australia/Sydney') sydneyHour = hour24;
        } catch (rowErr) {
          // One city failing shouldn't blank out the others.
        }
      }

      if (sydneyHour !== null) {
        setClass(document.body, 'night-dim', sydneyHour >= 22 || sydneyHour < 6);
      }

      tickFailCount = 0;
    } catch (err) {
      tickFailCount++;
      if (tickFailCount === 3) {
        showFallback('Something unexpected is stopping the clock from updating. Let Glen know the exact error: ' + (err && err.message ? err.message : err));
      }
    }

    if (window.requestAnimationFrame) {
      requestAnimationFrame(function () {
        setTimeout(tick, 1000 - (Date.now() % 1000));
      });
    } else {
      setTimeout(tick, 1000 - (Date.now() % 1000));
    }
  }

  try {
    rows = buildRows();
    tick();
  } catch (e) {
    showFallback('The clock failed to start (' + (e && e.message ? e.message : e) + '). Let Glen know.');
  }

  // Keep the screen awake where supported (iOS 16.4+). Fails silently on
  // older iPadOS versions -- use Settings > Display & Brightness > Auto-Lock
  // > Never on the iPad itself for reliable always-on behaviour.
  if ('wakeLock' in navigator) {
    var wakeLock = null;
    var requestWakeLock = function () {
      navigator.wakeLock.request('screen').then(function (wl) {
        wakeLock = wl;
      }, function () { /* ignore */ });
    };
    requestWakeLock();
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') requestWakeLock();
    });
  }
</script>

</body>
</html>
